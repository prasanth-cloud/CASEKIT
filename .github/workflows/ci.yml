name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration boundary tests
        run: pnpm exec vitest run tests/integration
      - name: Accessibility contracts
        run: pnpm exec vitest run tests/a11y
      - name: AI safety evaluations
        run: pnpm exec vitest run tests/evals
      - name: Release gate contract
        run: node --test scripts/release-gates.test.mjs
      - name: Build
        run: pnpm build
      - name: Public production smoke
        run: node scripts/public-smoke.mjs
      - name: CI release configuration check
        run: node scripts/check-release-gates.mjs --ci
