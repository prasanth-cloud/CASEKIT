<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11233f" />
    <meta name="description" content="CaseKit turns purchase evidence into a clear, reviewable refund request." />
    <title>CaseKit · Build a case pack</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <div class="brand-name">CaseKit</div>
            <div class="brand-caption">Evidence, organized.</div>
          </div>
        </div>

        <div class="workspace-switcher">
          <div class="workspace-avatar">DW</div>
          <div class="workspace-copy">
            <span class="workspace-label">Workspace</span>
            <strong>Demo workspace</strong>
          </div>
          <span class="chevron" aria-hidden="true">⌄</span>
        </div>

        <nav class="nav-list">
          <a class="nav-item active" href="#builder" aria-current="page">
            <span class="nav-icon" aria-hidden="true">＋</span>
            <span>New case</span>
          </a>
          <a class="nav-item" href="#builder" data-reset-case>
            <span class="nav-icon" aria-hidden="true">▦</span>
            <span>Cases</span>
            <span class="nav-count">1</span>
          </a>
          <a class="nav-item" href="#activity">
            <span class="nav-icon" aria-hidden="true">◷</span>
            <span>Follow-ups</span>
            <span class="nav-count quiet">0</span>
          </a>
        </nav>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-note">
          <div class="note-icon" aria-hidden="true">✦</div>
          <div>
            <strong>Keep your proof close</strong>
            <p>CaseKit drafts from your documents, not assumptions.</p>
          </div>
        </div>

        <div class="sidebar-footer">
          <a class="nav-item" href="#privacy">
            <span class="nav-icon" aria-hidden="true">⌁</span>
            <span>Privacy & safety</span>
          </a>
          <div class="user-row">
            <div class="user-avatar">RD</div>
            <div class="user-copy"><strong>Rudra</strong><span>Demo account</span></div>
            <span class="more-icon" aria-hidden="true">•••</span>
          </div>
        </div>
      </aside>

      <main class="main-content" id="main-content">
        <header class="topbar">
          <div class="breadcrumbs"><span>Cases</span><span class="crumb-slash">/</span><strong>New case</strong></div>
          <div class="topbar-actions">
            <span class="private-chip"><span class="tiny-dot"></span> Local demo</span>
            <button class="icon-button" type="button" aria-label="Open help">?</button>
            <div class="top-avatar">RD</div>
          </div>
        </header>

        <div id="app" class="page-wrap"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
